name: Forward request
run-name: Forwarded request

# Started by the form on GitHub Pages. The request arrives encrypted (see crypto.js), so this
# public repo's logs only ever show ciphertext. It is passed on, still encrypted, to the
# private repo, which holds the key. FORWARD_TOKEN can only start workflows there.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Encrypted request from the form"
        required: true
        type: string

permissions: {}

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the transcription run
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ secrets.FORWARD_TOKEN }}
          TARGET: jwollihe/ihe-transcripts-lite
        run: |
          [ ${#PAYLOAD} -lt 20000 ] || { echo "::error::payload too large"; exit 1; }
          jq -n --arg p "$PAYLOAD" '{ref: "main", inputs: {payload: $p}}' > body.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET/actions/workflows/transcribe.yml/dispatches" \
            --data @body.json)
          [ "$code" = 204 ] || { echo "::error::GitHub returned $code"; cat resp.txt; exit 1; }
          echo "Forwarded."
